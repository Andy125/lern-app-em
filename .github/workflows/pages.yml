name: Testen und veröffentlichen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pakete
        run: npm ci
      - name: Logik und Inhalte (jede Aufgabe nachgerechnet)
        run: node tools/test-logic.mjs
      - name: Version und Offline-Liste
        run: node tools/test-version.mjs
      - name: Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Ablauf wie ein Kind (Mission, Tier, Probe, Eltern, Sicherung)
        run: node tools/e2e.mjs
      - name: Spielstand nie verlieren
        run: node tools/e2e-speicher.mjs
      - name: iPad hochkant, quer und Handy
        run: node tools/e2e-geraete.mjs
      - name: Offline
        run: node tools/test-offline.mjs
      - name: Zufälliges Durchklicken
        run: node tools/monkey.mjs 300 1
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
